spring.application.name=attendance-system

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_system
spring.datasource.username=root
spring.datasource.password=123456789

# JPA / Hibernate
## Hibernate schema generation strategy
## Options: none, validate, update, create, create-drop
## - validate: validates the schema, fails if tables/columns missing (current setting)
## - update: attempts to update the schema to match entities (will create missing tables/columns)
## - create / create-drop: recreate schema (drops existing data) - not for production
## For development when you've dropped tables and want Hibernate to recreate them, use 'update' or 'create'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#JWT
app.jwt.secret=ThisIsASecretKeyForJwtTokenThisIsASecretKeyForJwtToken
app.jwt.expiration=86400000

# Python AI Service
app.ai.base-url=http://localhost:8000

# File Upload
app.file.upload-dir=uploads/

